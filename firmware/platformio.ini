; ArogyaX sensor unit firmware — ESP32 (classic, dual-core WROOM) + AD8232 + MAX30102.
;
; NOT YET BUILT. No PlatformIO is installed in the environment this was
; written in (see .wayfinder/map.md), so this file has never been run
; through `pio run`. Written directly against contracts/ble.md and
; contracts/ppg.md (both LOCKED) — verify it builds and flashes as the
; first step of ticket 013, ideally right after ticket 003 confirms the
; wiring with the electrodes.
;
; Board is the classic ESP32, not the ESP32-S3 docs/PRODUCT.md section 8's
; BOM currently names — the wiring map this was built against uses GPIO32/
; 33/34, which only exist as ADC1-capable pins on the original ESP32.
; Worth reconciling PRODUCT.md's BOM line against whatever's actually on
; the bench (same kind of doc/hardware drift ticket 006 corrected before).

[env:esp32dev]
; Generic ESP32 DevKit V1 board id. Change this to match the exact dev
; board if it isn't a DOIT/WROOM-32 devkit clone.
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3

; SparkFun's MAX3010x library talks to the MAX30102 over the standard
; Arduino Wire API — well-documented, stable API surface, used here instead
; of a hand-rolled register-level driver. Unpinned because the exact latest
; version hasn't been checked against a real build; pin it once ticket 013
; gets a first successful compile.
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
